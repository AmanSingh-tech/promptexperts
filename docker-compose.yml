services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ailogracer
      POSTGRES_PASSWORD: ailogracer
      POSTGRES_DB: ailogracer
    ports:
      - "5435:5432"
    volumes:
      - ailogracer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailogracer"]
      interval: 3s
      retries: 20
volumes:
  ailogracer-db:
